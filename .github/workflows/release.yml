name: Release deployment package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway
            context: gateway
          - image: hub
            context: hub
          - image: vulnerability
            context: Vulnerability
          - image: wazuh
            context: wazuh
          - image: docs
            context: docs
    steps:
      - uses: actions/checkout@v4

      - id: release
        name: Resolve image coordinates
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.release.outputs.owner }}/middleware-2.0-${{ matrix.image }}:${{ steps.release.outputs.version }}
            ghcr.io/${{ steps.release.outputs.owner }}/middleware-2.0-${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub Release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Assemble deployment bundle
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release/middleware-hub
          cp deploy/compose.yaml release/middleware-hub/compose.yaml
          cp deploy/.env.example release/middleware-hub/.env.example
          cp packaging/middleware-hub release/middleware-hub/middleware-hub
          cp packaging/middleware-install.sh release/middleware-hub/middleware-install.sh
          printf '%s\n' "$version" > release/middleware-hub/VERSION
          tar -C release -czf release/middleware-hub-bundle.tar.gz middleware-hub
          cp packaging/middleware-install.sh release/middleware-install.sh
          cd release
          sha256sum middleware-hub-bundle.tar.gz middleware-install.sh > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Middleware Hub ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            release/middleware-install.sh \
            release/middleware-hub-bundle.tar.gz \
            release/SHA256SUMS
