server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true,"service":"hub-portal"}';
    }

    # Hashed build assets may be cached indefinitely, but a missing asset must
    # never fall through to index.html and masquerade as JavaScript.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry document contains content-hashed asset names, so browsers must
    # revalidate it after each deployment.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
