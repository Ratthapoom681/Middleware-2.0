# Rate limiting zone for auth endpoints
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80 default_server;
    server_name _;
    recursive_error_pages on;
    limit_req_status 429;

    # Re-resolve Docker service names after containers are recreated.
    resolver_timeout 500ms;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    location = /gateway-health {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true,"service":"gateway"}';
    }

    # ── 1. HUB SERVICE (ROOT) ──
    location / {
        set $hub_upstream http://hub:3000;
        proxy_pass $hub_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 502 503 504 =503 /hub-unavailable.html;
    }

    location = /hub-unavailable.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ── INDEPENDENT AUTHENTICATION SERVICE ──
    location = /login {
        return 308 /login/;
    }

    location ^~ /login/ {
        set $auth_upstream http://auth:3004;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /auth-unavailable.json;
    }

    # Rate-limit the independent login endpoint to prevent brute-force attacks
    location = /api/login {
        limit_req zone=login_limit burst=10 nodelay;
        
        set $auth_upstream http://auth:3004;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /auth-unavailable.json;
    }

    location = /api/login/mfa {
        limit_req zone=login_limit burst=10 nodelay;

        set $auth_upstream http://auth:3004;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /auth-unavailable.json;
    }

    location = /api/profile/mfa/enrollment/start {
        limit_req zone=login_limit burst=10 nodelay;

        set $auth_upstream http://auth:3004;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /auth-unavailable.json;
    }

    location = /api/profile/mfa/enrollment/confirm {
        limit_req zone=login_limit burst=10 nodelay;

        set $auth_upstream http://auth:3004;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /auth-unavailable.json;
    }

    location = /api/logout {
        set $auth_upstream http://auth:3004;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /auth-unavailable.json;
    }

    # Introspection is an internal service-to-service endpoint. Protected
    # applications call auth directly instead of traversing the edge.
    location = /api/auth/introspect {
        return 404;
    }

    location ^~ /api/auth/ {
        set $auth_upstream http://auth:3004;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /auth-unavailable.json;
    }

    location ^~ /api/users {
        set $auth_upstream http://auth:3004;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /auth-unavailable.json;
    }

    location ^~ /api/profile {
        set $auth_upstream http://auth:3004;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /auth-unavailable.json;
    }

    location = /auth-unavailable.json {
        internal;
        default_type application/json;
        return 503 '{"error":"Authentication service temporarily unavailable"}';
    }

    # Disable buffering for Server-Sent Events (SSE) sync stream
    location /defectdojo/api/sync/events {
        set $defectdojo_upstream http://defectdojo:3001;
        rewrite ^/defectdojo/(.*)$ /$1 break;
        proxy_pass $defectdojo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE Buffering Prevention
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
    }

    # Sync All can legitimately run longer than Nginx's default 60s upstream
    # read timeout while it pulls DefectDojo, checks Redmine, creates tickets,
    # and rechecks mitigations. Keep this request alive on deployed gateways.
    location = /defectdojo/api/sync-all {
        set $defectdojo_upstream http://defectdojo:3001;
        rewrite ^/defectdojo/(.*)$ /$1 break;
        proxy_pass $defectdojo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 2. DEFECTDOJO VIEWER SERVICE ──
    # Strip /defectdojo/ before proxying. Variable proxy_pass requires explicit rewrite.
    location /defectdojo/ {
        set $defectdojo_upstream http://defectdojo:3001;
        rewrite ^/defectdojo/(.*)$ /$1 break;
        proxy_pass $defectdojo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Adjust cookies path if the backend uses session cookies (fallback safety)
        proxy_cookie_path / /defectdojo;
    }

    # ── 3. WAZUH VIEWER SERVICE (MOCKUP) ──
    # Strip /wazuh/ before proxying. Variable proxy_pass requires explicit rewrite.
    location /wazuh/ {
        set $wazuh_upstream http://wazuh:3002;
        rewrite ^/wazuh/(.*)$ /$1 break;
        proxy_pass $wazuh_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 4. DOCUMENTATION SERVICE ──
    # Strip /docs/ before proxying. Variable proxy_pass requires explicit rewrite.
    location /docs/ {
        set $docs_upstream http://docs:3003;
        rewrite ^/docs/(.*)$ /$1 break;
        proxy_pass $docs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error handling configuration
    error_page 502 /502.html;
    location = /502.html {
        root /usr/share/nginx/html;
        internal;
        # Inline custom styled error message fitting the design system
        return 502 '{"error": "Bad Gateway - The requested middleware service is temporarily offline or rebuilding. Please try again in a few moments."}';
    }
}
