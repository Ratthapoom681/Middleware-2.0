services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_DIR: /app/data
      DATABASE_URL: postgres://${POSTGRES_USER:-defectdojo}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-defectdojo_viewer}
    ports:
      - "${APP_PORT:-3001}:3001"
    volumes:
      - app-data:/app/data
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-defectdojo_viewer}
      POSTGRES_USER: ${POSTGRES_USER:-defectdojo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  app-data:
  postgres-data:
