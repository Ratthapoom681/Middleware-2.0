services:
  gateway:
    build: ./gateway-service
    ports:
      - "${GATEWAY_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/gateway-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  hub:
    build: ./hub-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    restart: unless-stopped

  auth-primary:
    image: internal-security-middleware-auth:local
    build: ./auth-service
    environment:
      NODE_ENV: production
      PORT: 3004
      AUTH_DATABASE_URL: postgres://${AUTH_PG_USER:-middleware_auth}:${AUTH_PG_PASSWORD:-change-me}@auth-db:5432/${AUTH_PG_DB:-middleware_auth}
      LEGACY_DATABASE_URL: postgres://${PG_USER:-defectdojo}:${PG_PASSWORD:-change-me}@db:5432/${PG_DB:-defectdojo_viewer}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-me-in-production}
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:-dev-internal-auth-service-token}
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/api/auth/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    restart: unless-stopped

  linux-log-collector:
    build: ./vulnerability-service/linux-log-collector
    environment:
      NODE_ENV: production
      PORT: 3011
      AUTH_LOG_SOURCE_MODE: auto
      AUTH_LOG_PATHS: /host/var/log/secure,/host/var/log/auth.log
      AUTH_JOURNAL_DIRS: /host/var/log/journal,/host/run/log/journal
      AUTH_JOURNAL_UNITS: sshd.service,sudo.service,su.service,systemd-logind.service
      AUTH_LOG_MAX_ROWS: 2000
      AUTH_LOG_REFRESH_MS: 5000
    volumes:
      - /var/log:/host/var/log:ro
      - /run/log/journal:/host/run/log/journal:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3011/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: "0.10"
    restart: unless-stopped

  defectdojo:
    build: ./vulnerability-service
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_DIR: /app/data
      DATABASE_URL: postgres://${PG_USER:-defectdojo}:${PG_PASSWORD:-change-me}@db:5432/${PG_DB:-defectdojo_viewer}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-me-in-production}
      AUTH_INTROSPECTION_URL: http://gateway/api/auth/introspect
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:-dev-internal-auth-service-token}
      AUTH_REQUIRED_APP: defectdojo
      AUTH_INTROSPECTION_TIMEOUT_MS: 1000
      AUTH_CIRCUIT_OPEN_MS: 15000
      ENABLE_LEGACY_LOCAL_AUTH: "false"
      AUTO_SYNC_STATUS_EMBEDDED: "false"
      LINUX_AUTH_LOG_COLLECTOR_URL: http://linux-log-collector:3011
    volumes:
      - defectdojo-data:/app/data
    depends_on:
      linux-log-collector:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.5"
    restart: unless-stopped

  auto-sync-status:
    build: ./vulnerability-service
    command: ["node", "backend/auto-sync-status.cjs"]
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      DATABASE_URL: postgres://${PG_USER:-defectdojo}:${PG_PASSWORD:-change-me}@db:5432/${PG_DB:-defectdojo_viewer}
      NODE_OPTIONS: --max-old-space-size=80
      PG_POOL_MAX: 2
      REDMINE_CHECK_CONCURRENCY: 2
      UV_THREADPOOL_SIZE: 2
    volumes:
      - defectdojo-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    mem_limit: 128m
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.10"
    restart: unless-stopped

  # Wazuh — static frontend only (no backend, no DB)
  wazuh:
    build: ./wazuh-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.10"
    restart: unless-stopped

  docs:
    build: ./docs-service
    environment:
      NODE_ENV: production
      PORT: 3003
      DOCS_DIR: /app/docs
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-me-in-production}
      AUTH_INTROSPECTION_URL: http://gateway/api/auth/introspect
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:-dev-internal-auth-service-token}
      AUTH_REQUIRED_APP: docs
      AUTH_INTROSPECTION_TIMEOUT_MS: 1000
      AUTH_CIRCUIT_OPEN_MS: 15000
    volumes:
      - ./docs-service/docs:/app/docs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PG_DB:-defectdojo_viewer}
      POSTGRES_USER: ${PG_USER:-defectdojo}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.0"
    restart: unless-stopped

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AUTH_PG_DB:-middleware_auth}
      POSTGRES_USER: ${AUTH_PG_USER:-middleware_auth}
      POSTGRES_PASSWORD: ${AUTH_PG_PASSWORD:-change-me}
    volumes:
      - auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped

  monitor:
    image: nicolargo/glances:latest-full
    pid: host
    ports:
      - "127.0.0.1:${MONITOR_PORT:-61208}:61208"
    environment:
      GLANCES_OPT: "-w"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.15"
    restart: unless-stopped

volumes:
  defectdojo-data:
    name: defectdojo-viewer_defectdojo-data
  postgres-data:
    name: defectdojo-viewer_postgres-data
  auth-data:
    name: defectdojo-viewer_auth-data
