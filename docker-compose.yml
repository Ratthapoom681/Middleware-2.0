services:
  gateway:
    build: ./gateway-service
    ports:
      - "${GATEWAY_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/gateway-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  hub:
    build: ./hub-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

  auth-primary: &auth-service
    image: internal-security-middleware-auth:local
    build: ./auth-service
    environment:
      NODE_ENV: production
      PORT: 3004
      AUTH_DATABASE_URL: postgres://${AUTH_PG_USER:-middleware_auth}:${AUTH_PG_PASSWORD:-change-me}@auth-db:5432/${AUTH_PG_DB:-middleware_auth}
      LEGACY_DATABASE_URL: postgres://${PG_USER:-defectdojo}:${PG_PASSWORD:-change-me}@db:5432/${PG_DB:-defectdojo_viewer}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-me-in-production}
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:-dev-internal-auth-service-token}
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/api/auth/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

  auth-secondary:
    <<: *auth-service

  defectdojo:
    build: ./vulnerability-service
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_DIR: /app/data
      DATABASE_URL: postgres://${PG_USER:-defectdojo}:${PG_PASSWORD:-change-me}@db:5432/${PG_DB:-defectdojo_viewer}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-me-in-production}
      AUTH_INTROSPECTION_URL: http://gateway/api/auth/introspect
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:-dev-internal-auth-service-token}
      AUTH_REQUIRED_APP: defectdojo
      AUTH_INTROSPECTION_TIMEOUT_MS: 1000
      AUTH_CIRCUIT_OPEN_MS: 15000
      ENABLE_LEGACY_LOCAL_AUTH: "false"
    volumes:
      - defectdojo-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    restart: unless-stopped

  # Wazuh — static frontend only (no backend, no DB)
  wazuh:
    build: ./wazuh-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    restart: unless-stopped

  docs:
    build: ./docs-service
    environment:
      NODE_ENV: production
      PORT: 3003
      DOCS_DIR: /app/docs
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-me-in-production}
      AUTH_INTROSPECTION_URL: http://gateway/api/auth/introspect
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:-dev-internal-auth-service-token}
      AUTH_REQUIRED_APP: docs
      AUTH_INTROSPECTION_TIMEOUT_MS: 1000
      AUTH_CIRCUIT_OPEN_MS: 15000
    volumes:
      - ./docs-service/docs:/app/docs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PG_DB:-defectdojo_viewer}
      POSTGRES_USER: ${PG_USER:-defectdojo}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    restart: unless-stopped

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AUTH_PG_DB:-middleware_auth}
      POSTGRES_USER: ${AUTH_PG_USER:-middleware_auth}
      POSTGRES_PASSWORD: ${AUTH_PG_PASSWORD:-change-me}
    volumes:
      - auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

volumes:
  defectdojo-data:
    name: defectdojo-viewer_defectdojo-data
  postgres-data:
    name: defectdojo-viewer_postgres-data
  auth-data:
    name: defectdojo-viewer_auth-data
