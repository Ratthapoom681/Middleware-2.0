name: middleware-hub

services:
  gateway:
    image: ${IMAGE_REGISTRY:-ghcr.io/ratthapoom681}/${IMAGE_PREFIX:-middleware-2.0}-gateway:${APP_VERSION:?APP_VERSION is required}
    ports:
      - "${GATEWAY_BIND_ADDRESS:-0.0.0.0}:${GATEWAY_PORT:-8080}:80"
    depends_on:
      hub:
        condition: service_healthy
      defectdojo:
        condition: service_healthy
      wazuh:
        condition: service_healthy
      docs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null && wget -qO- http://127.0.0.1/defectdojo/api/health >/dev/null && wget -qO- http://127.0.0.1/wazuh/ >/dev/null && wget -qO- http://127.0.0.1/docs/api/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  hub:
    image: ${IMAGE_REGISTRY:-ghcr.io/ratthapoom681}/${IMAGE_PREFIX:-middleware-2.0}-hub:${APP_VERSION:?APP_VERSION is required}
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_DATABASE_URL: postgres://${AUTH_PG_USER}:${AUTH_PG_PASSWORD}@auth-db:5432/${AUTH_PG_DB}
      LEGACY_DATABASE_URL: postgres://${PG_USER}:${PG_PASSWORD}@db:5432/${PG_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:?AUTH_SERVICE_TOKEN is required}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
    depends_on:
      auth-db:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  defectdojo:
    image: ${IMAGE_REGISTRY:-ghcr.io/ratthapoom681}/${IMAGE_PREFIX:-middleware-2.0}-vulnerability:${APP_VERSION:?APP_VERSION is required}
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_DIR: /app/data
      DATABASE_URL: postgres://${PG_USER}:${PG_PASSWORD}@db:5432/${PG_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_INTROSPECTION_URL: http://hub:3000/api/auth/introspect
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:?AUTH_SERVICE_TOKEN is required}
      AUTH_REQUIRED_APP: defectdojo
      ENABLE_LEGACY_LOCAL_AUTH: "false"
    volumes:
      - defectdojo-data:/app/data
    depends_on:
      hub:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  wazuh:
    image: ${IMAGE_REGISTRY:-ghcr.io/ratthapoom681}/${IMAGE_PREFIX:-middleware-2.0}-wazuh:${APP_VERSION:?APP_VERSION is required}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  docs:
    image: ${IMAGE_REGISTRY:-ghcr.io/ratthapoom681}/${IMAGE_PREFIX:-middleware-2.0}-docs:${APP_VERSION:?APP_VERSION is required}
    environment:
      NODE_ENV: production
      PORT: 3003
      DOCS_DIR: /app/docs
      AUTH_INTROSPECTION_URL: http://hub:3000/api/auth/introspect
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:?AUTH_SERVICE_TOKEN is required}
    depends_on:
      hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PG_DB:?PG_DB is required}
      POSTGRES_USER: ${PG_USER:?PG_USER is required}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AUTH_PG_DB:?AUTH_PG_DB is required}
      POSTGRES_USER: ${AUTH_PG_USER:?AUTH_PG_USER is required}
      POSTGRES_PASSWORD: ${AUTH_PG_PASSWORD:?AUTH_PG_PASSWORD is required}
    volumes:
      - auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  defectdojo-data:
  postgres-data:
  auth-data:
